<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/crab-cutout-orange.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#F9F7F2" />
    <title>GV Science</title>
    <script>
      // ANCHOR TREE の外部ブラウザ入口（/tree）をホーム画面に追加したときのアイコン・名前（2026-10-19）。
      // HTML は GV Science と共通なので、/tree のときだけ最初に差し込む（GV Science 側にはアイコンを付けない）。
      // 角丸はしない正方形の PNG（iOS・Android が自分で角を丸める）。元は ANCHOR_TREE_logo の appicon_route
      (function () {
        var p = location.pathname;
        if (p !== '/tree' && p.indexOf('/tree/') !== 0) return;
        document.title = 'ANCHOR TREE';
        var head = document.head;
        var add = function (tag, attrs) {
          var el = document.createElement(tag);
          for (var k in attrs) el.setAttribute(k, attrs[k]);
          head.appendChild(el);
        };
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.parentNode.removeChild(icon);
        add('link', { rel: 'icon', type: 'image/png', sizes: '192x192', href: '/tree/icon/anchor-tree-192.png' });
        add('link', { rel: 'apple-touch-icon', sizes: '180x180', href: '/tree/icon/anchor-tree-180.png' });
        add('link', { rel: 'manifest', href: '/tree/anchor-tree.webmanifest' });
        add('meta', { name: 'apple-mobile-web-app-title', content: 'ANCHOR TREE' });
        add('meta', { name: 'application-name', content: 'ANCHOR TREE' });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
